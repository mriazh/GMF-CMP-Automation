[project]
name = "cmp-automation"
version = "1.0.0"
description = "Production-ready automation tool for Telkomsel CMP Portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "zoneinfo>=0.2.1; python_version < '3.9'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
cmp-automation = "cmp_automation.cli:cli_main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "live: opt-in live authentication test; requires CMP_RUN_LIVE_TESTS=1 (triggers a real OTP)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true
exclude = ["tests/"]

[tool.playwright]
browsers = ["firefox"]